# プルリクエストを作ったときに、データの検証・テスト・ビルドが通るかを確かめる。
name: テスト

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: データの検証
        run: npm run validate
      - name: テスト
        run: npm test
      - name: ビルド
        run: npm run build
